[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freeglm"
dynamic = ["version"]
description = "FreeGLM: composable Agent Skills and MCP tools for supported local-file I/O, vision-language APIs, long-video graph memory, media generation and editing, and Blender/FreeCAD workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
# Ship this project's LICENSE plus third-party attribution + vendored MIT license texts
# (Blender/FreeCAD addons) into the wheel's .dist-info/licenses/.
license-files = [
    "LICENSE",
    "NOTICE",
    "src/capabilities/blender/NOTICE.md",
    "src/capabilities/freecad/NOTICE.md",
    "src/capabilities/blender/freeglm_blender/vendor/LICENSE",
    "src/capabilities/freecad/freeglm_freecad/vendor/FreeCADMCP/LICENSE",
]
authors = [{ name = "yenns7" }]
keywords = ["mcp", "vision-language", "glm", "zhipu", "qwen", "video", "agent-skills"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Base runtime — enough to run a server + read_image; everything else is an extra below.
dependencies = [
    "mcp>=1.0.0,<2",
    "anyio>=4.0,<5",
    "pillow<12",
]

[project.urls]
Homepage = "https://github.com/yenns7/freeglm"
Repository = "https://github.com/yenns7/freeglm"
Issues = "https://github.com/yenns7/freeglm/issues"
Upstream = "https://github.com/QwenLM/Qwen-MM-Plugins"

[project.optional-dependencies]
# capability extras — compose via the profiles below
api = ["openai", "dashscope", "requests"]     # vision_chat / ocr / grounding / segmentation / ASR
search = ["requests"]                          # web_search / web_extractor / image_search (Serper)
# viz = the full visualize stack — a `core` install then renders every format out of the box.
viz = [
    "pypdfium2", "resvg-py", "lxml",          # PDF raster+text (pypdfium2) / SVG (resvg) / DrawIO / LaTeX
    "pandas", "matplotlib", "openpyxl", "tabulate",  # CSV / XLSX
    "numpy<3",                                # 3D render math (renderers/model3d) — also pulled in by the libs above
    "nbformat",                               # Jupyter notebooks
    "geopandas",                              # GIS (.geojson/.kml/.shp)
    "trimesh", "pyrender", "cascadio",        # 3D (.obj/.stl/.glb)
    "playwright",                             # HTML screenshot
]
video-memory = ["numpy<3", "requests"]        # long-video graph-memory server
video-edit = ["dashscope>=1.25.16", "requests"]  # image/video/audio generation server
example = ["openai"]                           # template capability — base deps + openai (for the `describe` API demo)
oss = ["oss2"]                                 # optional: upload large media to OSS for a signed URL (memory-build clip upload, api oversized-video upload)
blender = []                                   # Blender live-session MCP client (stdlib socket; needs a running Blender + addon)
freecad = []                                   # FreeCAD live-session MCP client (stdlib xml-rpc; needs a running FreeCAD + addon)
# profiles — install ONE. `core` is now local-only (no API key); cloud tools are the api/search
# capabilities. `all` layers every server on top.
core = ["freeglm[viz]"]
memory = ["freeglm[core,video-memory]"]
all = ["freeglm[core,api,search,video-memory,video-edit,blender,freecad]"]

[project.scripts]
freeglm-core = "freeglm_core.__main__:main"
freeglm-api = "freeglm_api.__main__:main"
freeglm-search = "freeglm_search.__main__:main"
freeglm-video-memory = "freeglm_video_memory.__main__:main"
freeglm-video-edit = "freeglm_video_edit.__main__:main"
freeglm-example = "freeglm_example.__main__:main"
freeglm-blender = "freeglm_blender.__main__:main"
freeglm-freecad = "freeglm_freecad.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Skip hydra-core's pytest plugin if it's in the ambient env (it can fail to import on an antlr4
# mismatch); harmless no-op otherwise.
addopts = "-p no:hydra_pytest"
markers = [
    # Live API round-trips (test_api_reachability.py). Skipped automatically when the relevant
    # credential is absent; select with `-m reachability`, exclude with `-m "not reachability"`.
    "reachability: hits real DashScope/Zhipu/Serper endpoints; requires credentials and explicit opt-in",
]

# Packages live at src/capabilities/<cap>/<import_name>/ and src/{shared,mcp_framework}: map each
# import name to its dir, then find them + subpackages under `where` (include=… drops the skill/ dirs).
[tool.setuptools]
py-modules = ["mcp_framework"]

[tool.setuptools.package-dir]
"" = "src"
freeglm_core = "src/capabilities/core/freeglm_core"
freeglm_api = "src/capabilities/api/freeglm_api"
freeglm_search = "src/capabilities/search/freeglm_search"
freeglm_video_memory = "src/capabilities/video-memory/freeglm_video_memory"
freeglm_video_edit = "src/capabilities/video-edit/freeglm_video_edit"
freeglm_example = "src/capabilities/example/freeglm_example"
freeglm_blender = "src/capabilities/blender/freeglm_blender"
freeglm_freecad = "src/capabilities/freecad/freeglm_freecad"
shared = "src/shared"

[tool.setuptools.packages.find]
where = ["src/capabilities/core", "src/capabilities/api", "src/capabilities/search", "src/capabilities/video-memory", "src/capabilities/video-edit", "src/capabilities/example", "src/capabilities/blender", "src/capabilities/freecad", "src"]
include = ["freeglm*", "shared*"]

# The vendored live-session addons ship as package DATA (not importable subpackages — no __init__ on
# vendor/): --launch-app resolves them on disk and hands them to Blender/FreeCAD, which load them.
[tool.setuptools.package-data]
freeglm_blender = ["vendor/*.py", "vendor/**/*.py", "vendor/LICENSE"]
freeglm_freecad = ["vendor/**/*.py", "vendor/FreeCADMCP/*.py", "vendor/FreeCADMCP/rpc_server/*.py", "vendor/FreeCADMCP/LICENSE"]

[tool.setuptools.dynamic]
version = { attr = "mcp_framework.__version__" }
